<div class="container page">
  <div class="auth-layout">
    <div>
      <span class="eyebrow">Acesso</span>
      <h1>Escolher instituição</h1>
      <p>Seu e-mail está cadastrado em mais de uma instituição. Informe o identificador para continuar.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" style="max-width:420px">
        <label class="field">
          <span>Instituição</span>
          <input class="input" type="text" formControlName="entity_id" placeholder="entity_id" />
        </label>

        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <button type="submit" class="btn btn--primary" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    </div>

    <aside class="panel panel--accent panel--quiet">
      <div class="eyebrow" style="margin-bottom:14px">Acesso restrito</div>
      <p style="font-size:14px">Use o e-mail de aluno da UTFPR. Servidores e visitantes não têm cadastro no CampusOS.</p>
      <div style="height:1px;background:var(--line);margin:16px 0"></div>
      <div style="font-size:14px;line-height:1.9">
        <a href="#" style="display:block">Suporte da coordenação</a>
      </div>
    </aside>
  </div>
</div>
